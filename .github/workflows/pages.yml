# Publish the simulator to GitHub Pages.
#
# The site is plain static files (no build step). The service worker in
# coi-serviceworker.js adds the cross-origin-isolation headers that Pages
# cannot set, so SharedArrayBuffer (and therefore the OpMode runtime) works.
#
# First run: this workflow enables Pages for the repository automatically
# (source = GitHub Actions). If your organisation blocks that, enable it once
# under Settings -> Pages -> Source: GitHub Actions, then re-run the workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/ftc-2026-field-simulator-4iqxeg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
